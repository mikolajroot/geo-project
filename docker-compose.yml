name: geo-project

services:
  postgres:
    image: postgis/postgis:18-3.6
    networks:
      - db-net
    env_file: .env
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/pgdata
    volumes:
      - geo_postgres_data:/var/lib/postgresql
    ports:
      - "5435:5432"
    secrets:
      - db_password
      - db_user
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  svc-layers:
    build:
      context: .
      args:
        SERVICE_NAME: svc-layers
    networks:
      - app-net
      - db-net
      - proxy-net
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DB_HOST=${DB_HOST}
      - DB_PORT=5432
      - DB_USER_FILE=/run/secrets/db_user
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_DB=${POSTGRES_DB}
      - SEED_DB=true
    secrets:
      - db_user
      - db_password
      - secret_key
    depends_on:
      postgres:
        condition: service_healthy

  svc-auth:
    build:
      context: .
      args:
        SERVICE_NAME: svc-auth
    networks:
      - app-net
      - db-net
      - proxy-net
    expose:
      - "8081"
    environment:
      - PORT=8081
      - DB_HOST=${DB_HOST}
      - DB_PORT=5432
      - DB_USER_FILE=/run/secrets/db_user
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_DB=${POSTGRES_DB}
    secrets:
      - db_user
      - db_password
      - secret_key
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - svc-auth
      - svc-layers
    restart: always
    networks:
      - proxy-net

volumes:
    geo_postgres_data:

networks:
  db-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1
  app-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.2.0/24
          gateway: 192.168.2.1
  proxy-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.3.0/24
          gateway: 192.168.3.1

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_user:
    file: ./secrets/db_user.txt
  secret_key:
    file: ./secrets/secret_key.txt