name: geo-project

services:
  postgres:
    image: postgis/postgis:18-3.6
    networks:
      - db-net
    env_file: .env
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/pgdata
    volumes:
      - geo_postgres_data:/var/lib/postgresql
    ports:
      - "5435:5432"
    secrets:
      - db_password
      - db_user
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: geo_annotations
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "mongosh", "-u", "admin", "-p", "secret", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  svc-layers:
    build:
      context: .
      args:
        SERVICE_NAME: svc-layers
    networks:
      - app-net
      - db-net
      - proxy-net
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER_FILE=/run/secrets/db_user
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_DB=${POSTGRES_DB}
      - SEED_DB=${SEED_DB}
      - SEED_DB_COUNT=${SEED_DB_COUNT}
    secrets:
      - db_user
      - db_password
      - secret_key
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  svc-auth:
    build:
      context: .
      args:
        SERVICE_NAME: svc-auth
    networks:
      - app-net
      - db-net
      - proxy-net
    expose:
      - "8081"
    environment:
      - PORT=8081
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER_FILE=/run/secrets/db_user
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_DB=${POSTGRES_DB}
    secrets:
      - db_user
      - db_password
      - secret_key
    depends_on:
      postgres:
        condition: service_healthy

  svc-features:
    build:
      context: .
      args:
        SERVICE_NAME: svc-features
    networks:
      - app-net
      - db-net
      - proxy-net
    expose:
      - "8082"
    environment:
      - PORT=8082
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER_FILE=/run/secrets/db_user
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_DB=${POSTGRES_DB}
      - SEED_DB=${SEED_DB}
      - SEED_DB_COUNT=${SEED_DB_COUNT}
    secrets:
      - db_user
      - db_password
      - secret_key
    depends_on:
      postgres:
        condition: service_healthy
      svc-layers:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  svc-analytics:
    build:
      context: .
      args:
        SERVICE_NAME: svc-analytics
    networks:
      - app-net
      - db-net
      - proxy-net
    expose:
      - "8083"
    environment:
      - PORT=8083
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER_FILE=/run/secrets/db_user
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_DB=${POSTGRES_DB}
    secrets:
      - db_user
      - db_password
      - secret_key
    depends_on:
      postgres:
        condition: service_healthy
  svc-annotations:
    build: 
      context: .
      args:
        SERVICE_NAME: svc-annotations
    environment:
      - MONGO_URI=mongodb://admin:secret@mongodb:27017/
      - MONGO_DB_NAME=geo_annotations
      - PORT=8084
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER_FILE=/run/secrets/db_user
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_DB=${POSTGRES_DB}
      - SEED_DB=${SEED_DB}
      - SEED_DB_COUNT=${SEED_DB_COUNT}
    expose:
      - "8084"
    depends_on:
      mongodb:
        condition: service_healthy
      svc-features:
        condition: service_healthy
    networks:
      - app-net
      - db-net
      - proxy-net
    secrets:
      - db_user
      - db_password
      - secret_key
  svc-revisions:
    build: 
      context: .
      args:
        SERVICE_NAME: svc-revisions
    environment:
      - MONGO_URI=mongodb://admin:secret@mongodb:27017/
      - MONGO_DB_NAME=geo_annotations
      - PORT=8085
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER_FILE=/run/secrets/db_user
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_DB=${POSTGRES_DB}
      - SEED_DB=${SEED_DB}
      - SEED_DB_COUNT=${SEED_DB_COUNT}
    expose:
      - "8085"
    depends_on:
      mongodb:
        condition: service_healthy
      svc-features:
        condition: service_healthy
    networks:
      - app-net
      - db-net
      - proxy-net
    secrets:
      - db_user
      - db_password
      - secret_key
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - svc-auth
      - svc-layers
      - svc-features
      - svc-analytics
      - svc-annotations
    restart: always
    networks:
      - proxy-net

volumes:
    geo_postgres_data:
    mongodb_data:

networks:
  db-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1
  app-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.2.0/24
          gateway: 192.168.2.1
  proxy-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.3.0/24
          gateway: 192.168.3.1

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_user:
    file: ./secrets/db_user.txt
  secret_key:
    file: ./secrets/secret_key.txt